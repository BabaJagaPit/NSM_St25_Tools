<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NVRAM Custom Patcher</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* --- HINTERGRUNDBILD --- */
      background-image: url('hinterg.jpg'); 
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
        
    .container {
      width: 100%;
      max-width: 650px;
      background: rgba(255, 255, 255, 0.95);
      padding: 45px;
      border-radius: 12px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.2);
      box-sizing: border-box;
    }

    h2 { 
      color: #2c3e50; 
      border-bottom: 2px solid #2ecc71; 
      padding-bottom: 12px; 
      margin-top: 0;
      margin-bottom: 25px; 
      font-size: 32px;
    }
        
    .btn-back {
      background-color: #6c757d;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 25px;
    }
        
    .box { 
      background: rgba(248, 249, 250, 0.8); 
      border: 2px dashed #ccc; 
      padding: 25px; 
      text-align: center; 
      border-radius: 6px; 
      margin: 25px 0; 
    }
        
    .input-group { 
      margin: 15px 0 25px 0; 
      text-align: left; 
    }
        
    label { 
      display: block; 
      margin-bottom: 12px; 
      font-weight: bold; 
      color: #2c3e50; 
      font-size: 18px;
    }
        
    input[type="number"] { 
      width: 100%; 
      padding: 14px; 
      border: 2px solid #ccc; 
      border-radius: 6px; 
      font-size: 18px; 
      box-sizing: border-box; 
    }
        
    input[type="file"] { 
      display: none; 
    }
        
    .btn { 
      display: inline-block; 
      padding: 16px 32px; 
      background: #2ecc71; 
      color: white; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 18px;
    }

    .btn-patch {
      display: block;
      width: 100%;
      padding: 18px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 20px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 20px;
    }
    .btn-patch:disabled { background-color: #cccccc; cursor: not-allowed; }
    
    /* MEGA-Button Style passend zum restlichen UI */
    .btn-mega {
      display: none; /* Sichtbar nach dem Patchen */
      width: 100%;
      padding: 18px;
      background-color: #d63384;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 20px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
      text-align: center;
    }
    .btn-mega:hover { background-color: #b8236c; }

    #status { 
      margin-top: 20px; 
      font-weight: bold; 
      font-size: 16px;
      white-space: pre-line;
      line-height: 1.4;
    }
        
    .success { color: #27ae60; }
    .error { color: #c0392b; }
    .info-msg { color: #007BFF; }

    .output-item {
      margin-bottom: 10px;
      font-family: monospace;
      font-size: 16px;
      text-align: left;
      background: #f8f9fa;
      padding: 8px 12px;
      border-radius: 4px;
      border-left: 4px solid #007BFF;
    }
    .game-highlight { font-weight: bold; color: #28a745; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎰 Zulassungs Nr. NVRAM Patcher</h2>
    <button class="btn-back" onclick="window.history.back();">⬅ Zurück</button>
    <p style="font-size: 17px;">Schritt 1: Datei einlesen.<br>Schritt 2: auf Patchen klicken.<br>Schritt 3: *.bin hochladen.   
    <div class="input-group">
      <label for="numInput">Neue Zulassungs- / Gerätenummer:</label> 
      <input type="number" id="numInput" min="0" max="4294967295">
    </div>
   
    <div id="gameOutputs" style="margin-bottom: 15px; display: none;">
      <div class="output-item">Spielname (Offset 0x01F20): <span id="gameOutput1" class="game-highlight">-</span></div>
      <div class="output-item">Spielname (Offset 0x01F68): <span id="gameOutput2" class="game-highlight">-</span></div>
    </div>
   
    <div class="box">
      <label for="fileInput" class="btn">Datei auswählen &amp; analysieren (.bin)</label> 
      <input type="file" id="fileInput" accept=".bin,.rom,.ece" onchange="analyzeFile(this)">
      <div id="status">Warte auf Datei...</div>
    </div>
    
    <button id="patchBtn" class="btn-patch" onclick="patchAndDownload()" disabled>Jetzt Patchen &amp; Herunterladen</button>
    <button id="megaBtn" class="btn-mega" onclick="openMegaRequest()">📂 Bitte original "TK.bin" hochladen. Vielen Dank!😊</button>
  </div>

  <script>
    let fileDataBuffer = null;
    let originalFileName = "";
    const offsetBase = 0x01F20;

    function readAsciiFromBin(uint8Array, startOffset, length) {
        let text = "";
        const end = Math.min(startOffset + length, uint8Array.length);
        for (let i = startOffset; i < end; i++) {
            const code = uint8Array[i];
            if (code >= 32 && code <= 126) {
                text += String.fromCharCode(code);
            } else {
                text += " ";
            }
        }
        return text.replace(/\s+/g, ' ').trim();
    }

    function analyzeFile(inputElement) {
        const statusDiv = document.getElementById('status');
        const gameOutputs = document.getElementById('gameOutputs');
        const patchBtn = document.getElementById('patchBtn');
        const megaBtn = document.getElementById('megaBtn');
        
        if (!inputElement.files || inputElement.files.length === 0) return;
        
        const file = inputElement.files[0];
        originalFileName = file.name;
        megaBtn.style.display = "none";

        const reader = new FileReader();
        reader.onload = function(event) {
            fileDataBuffer = new Uint8Array(event.target.result);

            const name1 = readAsciiFromBin(fileDataBuffer, offsetBase, 24);
            const name2 = readAsciiFromBin(fileDataBuffer, offsetBase + 0x48, 24);
            document.getElementById("gameOutput1").textContent = name1 || "Nicht lesbar";
            document.getElementById("gameOutput2").textContent = name2 || "Nicht lesbar";
            gameOutputs.style.display = "block";

            let dynamicTarget = fileDataBuffer.length - 26; 

            if (dynamicTarget >= 0 && dynamicTarget + 3 < fileDataBuffer.length) {
                let view = new DataView(fileDataBuffer.buffer, fileDataBuffer.byteOffset, fileDataBuffer.byteLength);
                document.getElementById('numInput').value = String(view.getUint32(dynamicTarget, true));
                
                statusDiv.className = 'success';
                statusDiv.textContent = `✅ Datei erfolgreich geladen!\nGröße: ${fileDataBuffer.length} Bytes.`;
                patchBtn.disabled = false;
            } else {
                statusDiv.className = 'error';
                statusDiv.textContent = "❌ Fehler: Datei ist zu kurz für die Strukturberechnung.";
                document.getElementById('numInput').value = '';
                patchBtn.disabled = true;
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function openMegaRequest() {
        window.open("https://mega.nz/filerequest/LswsB1TUZ-E", "_blank");
    }

    function patchAndDownload() {
        const statusDiv = document.getElementById('status');
        const numInput = document.getElementById('numInput');
        const megaBtn = document.getElementById('megaBtn');

        if (!fileDataBuffer) return;

        let val = parseInt(numInput.value);
        if (isNaN(val) || val < 0 || val > 4294967295) {
            alert("Bitte gib eine gültige Nummer (0 bis 4294967295) ein.");
            return;
        }

        let dynamicTarget = fileDataBuffer.length - 26;

        if (dynamicTarget >= 0 && dynamicTarget + 3 < fileDataBuffer.length) {
            let view = new DataView(fileDataBuffer.buffer, fileDataBuffer.byteOffset, fileDataBuffer.byteLength);
            view.setUint32(dynamicTarget, val, true); // Little-Endian schreiben

            // Download auslösen
            const blob = new Blob([fileDataBuffer], { type: "application/octet-stream" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "patched_" + originalFileName;
            link.click();

            statusDiv.className = 'success';
            statusDiv.textContent = "✅ Erfolgreich gepatcht und heruntergeladen!";
            megaBtn.style.display = "block";
        } else {
            statusDiv.className = 'error';
            statusDiv.textContent = "❌ Schreibfehler: Zieladresse liegt außerhalb des Puffers.";
        }
    }
  </script>
</body>
</html>
