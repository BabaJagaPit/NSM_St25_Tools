<!DOCTYPE html>
<html lang="de">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M48T18 Timekeeper Uhrzeit-Steller</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      background: white;
      padding: 45px;
      border-radius: 12px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 650px;
    }
    h2 {
      margin-top: 0;
      color: #007BFF;
      font-size: 32px;
      margin-bottom: 8px;
    }
    h2 + h2 {
      color: #555;
      font-size: 24px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-bottom: 12px;
      font-weight: bold;
      font-size: 18px;
    }
    input[type="file"], input[type="datetime-local"] {
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 18px;
      font-family: inherit;
      background-color: #fff;
    }
    input[type="datetime-local"] {
      cursor: pointer;
    }
    .btn-group {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
    }
    button {
      flex: 2;
      padding: 18px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #0056b3;
    }
    .btn-back {
      flex: 1;
      background-color: #6c757d;
    }
    .btn-back:hover {
      background-color: #5a6268;
    }
    .output-box {
      margin-top: 30px;
      padding: 25px;
      background-color: #e9ecef;
      border-radius: 6px;
      font-family: monospace;
      font-size: 18px;
    }
    .output-item {
      margin-bottom: 15px;
    }
    .output-item:last-child {
      margin-bottom: 0;
    }
    .highlight {
      font-weight: bold;
      color: #d63384;
      font-size: 20px;
    }
    .status-msg {
      margin-top: 15px;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Uhrzeit-Steller</h2>
  <h2>Timekeeper "ST M48T18"</h2>

  <div class="form-group">
    <label for="fileInput">.bin Datei hochladen:</label>
    <input type="file" id="fileInput" accept=".bin">
  </div>

  <div class="form-group">
    <label for="timeInput">Gewünschte Zeit (Editierbar):</label>
    <input type="datetime-local" id="timeInput" step="1">
    <div id="statusOutput" class="status-msg"></div>
  </div>
  
  <div class="btn-group">
    <button class="btn-back" onclick="window.history.back();">⬅ Zurück</button>
    <button onclick="writeTimeOnly()">Uhrzeit stellen & Ausgeben</button>
  </div>
  
  <div class="output-box">
    <div class="output-item">Geschriebene Zeit-Bytes (Hex): <span id="timeOutput" class="highlight">-</span></div>
  </div>
</div>

<script>
// Vorauszahlung des aktuellen Datums und Uhrzeit beim Laden der Seite
window.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  // Lokale Zeit formatiert für datetime-local (YYYY-MM-DDTHH:mm:ss)
  const offset = now.getTimezoneOffset() * 60000;
  const localISOTime = (new Date(now - offset)).toISOString().slice(0, 19);
  document.getElementById('timeInput').value = localISOTime;
});

// Hilfsfunktion zur BCD-Konvertierung
function toBCD(val) {
  return ((Math.floor(val / 10) << 4) | (val % 10)) & 0xFF;
}

function writeTimeOnly() {
  const fileInput = document.getElementById("fileInput");
  const timeInput = document.getElementById("timeInput");
  const statusOutput = document.getElementById("statusOutput");
  
  statusOutput.textContent = "";
  statusOutput.style.color = "initial";

  if (fileInput.files.length === 0) {
    alert("Bitte wähle zuerst eine .bin Datei aus.");
    return;
  }

  if (!timeInput.value) {
    alert("Bitte wähle ein gültiges Datum und eine Uhrzeit aus.");
    return;
  }

  // 1. Berechnung der gewählten Uhrzeit (BCD)
  const userDate = new Date(timeInput.value);
  
  const yearBCD = toBCD(userDate.getFullYear() % 100);
  const monthBCD = toBCD(userDate.getMonth() + 1);
  const dayBCD = toBCD(userDate.getDate());
  
  // Wochentag-Korrektur basierend auf dem gewählten Datum: Montag=1, ..., Sonntag=7
  let jsDay = userDate.getDay(); 
  let dayOfWeek = jsDay === 0 ? 7 : jsDay; 
  const dayOfWeekBCD = toBCD(dayOfWeek);
  
  const hoursBCD = toBCD(userDate.getHours());
  const minutesBCD = toBCD(userDate.getMinutes());
  const secondsBCD = toBCD(userDate.getSeconds());

  // Registeranordnung M48T18 (Letzte 8 Bytes im RAM)
  const clockBytes = [
    0x00,          // Steuerregister
    secondsBCD,    // Sekunden
    minutesBCD,    // Minuten
    hoursBCD,      // Stunden
    dayOfWeekBCD,  // Wochentag (Montag=1)
    dayBCD,        // Tag
    monthBCD,      // Monat
    yearBCD        // Jahr
  ];

  const clockHexStr = clockBytes
    .map(b => b.toString(16).toUpperCase().padStart(2, '0'))
    .join(' ');

  // UI aktualisieren
  document.getElementById("timeOutput").textContent = clockHexStr;

  // 2. Datei einlesen, Uhrzeit am Ende überschreiben und ausgeben
  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    const buffer = e.target.result;
    const view = new Uint8Array(buffer);

    // Uhrzeit-Bytes an das absolute Ende der Datei schreiben
    if (view.length >= 8) {
      const timeStartIndex = view.length - 8;
      for (let k = 0; k < 8; k++) {
        view[timeStartIndex + k] = clockBytes[k];
      }
    } else {
      statusOutput.textContent = "❌ Datei ist zu kurz (mindestens 8 Bytes erforderlich)!";
      statusOutput.style.color = "red";
      return;
    }

    // Datei direkt ausgeben / Download starten
    const blob = new Blob([view], { type: "application/octet-stream" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "time_set_" + file.name;
    link.click();

    statusOutput.textContent = "✅ Gewählte Uhrzeit gesetzt und Datei wird ausgegeben!";
    statusOutput.style.color = "green";
  };

  reader.readAsArrayBuffer(file);
}
</script>

</body>
</html>
