<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Byte-Konverter</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* --- HINTERGRUNDBILD AKTIVIERT --- */
      background-image: url('hinterg.jpg'); 
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      /* ---------------------------------- */
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      background: rgba(255, 255, 255, 0.95); /* Leicht transparent, damit das Bild durchschimmert */
      padding: 45px;
      border-radius: 12px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 650px;
    }
    h2 {
      margin-top: 0;
      color: #007BFF;
      font-size: 32px;
      margin-bottom: 8px;
    }
    h2 + h2 {
      color: #555;
      font-size: 24px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin-bottom: 12px;
      font-weight: bold;
      font-size: 20px;
    }
    input[type="date"], input[type="file"] {
      width: 100%;
      padding: 16px;
      box-sizing: border-box;
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 22px;
      font-family: inherit;
    }
    input[type="file"] {
      background: #fff;
      cursor: pointer;
      font-size: 18px;
    }
    .btn-group {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
    }
    button {
      flex: 2;
      padding: 18px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #0056b3;
    }
    .btn-back {
      flex: 1;
      background-color: #6c757d;
    }
    .btn-back:hover {
      background-color: #5a6268;
    }
    .output-box {
      margin-top: 35px;
      padding: 25px;
      background-color: #e9ecef;
      border-radius: 6px;
      font-family: monospace;
      font-size: 18px;
    }
    .output-item {
      margin-bottom: 15px;
    }
    .output-item:last-child {
      margin-bottom: 0;
    }
    .highlight {
      font-weight: bold;
      color: #d63384;
      font-size: 20px;
    }
    .game-highlight {
      font-weight: bold;
      color: #28a745;
      font-size: 20px;
    }
    .image-container {
      margin-top: 35px;
      text-align: center;
    }
    .image-container img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid #ddd;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Laufzeit Berechnung NSM St25</h2>
  <h2>Timekeeper "ST M48T18"</h2>
  
  <div class="form-group">
    <label for="fileInput">Originale .bin Datei einlesen:</label>
    <input type="file" id="fileInput" accept=".bin,.rom,.dat">
  </div>

  <div class="form-group">
    <label for="dateInput">Ablauf-Datum auswählen:</label>
    <input type="date" id="dateInput" max="2099-12-31" value="2033-04-30">
  </div>
  
  <div class="btn-group">
    <button class="btn-back" onclick="window.history.back();">⬅ Zurück</button>
    <button onclick="calculateBytes()">Berechnen</button>
  </div>
  
  <div class="output-box">
    <div class="output-item">Spielname (Offset 0x01F20): <span id="gameOutput1" class="game-highlight">-</span></div>
    <div class="output-item">Spielname (Offset 0x01F68): <span id="gameOutput2" class="game-highlight">-</span></div>
    <div class="output-item">Dezimalwert: <span id="decOutput" class="highlight">-</span></div>
    <div class="output-item">Byte-Sequenz: <span id="hexOutput" class="highlight">-</span></div>
  </div>

  <div class="image-container">
    <img src="HEX_Position.jpg" alt="Beschreibung des Bildes">
  </div>
</div>

<script>
// Aktuelles Datum sauber auslesen (Format: YYYY-MM-DD)
const today = new Date().toISOString().split('T')[0];
document.getElementById("dateInput").setAttribute("min", today);

// Hilfsfunktion: Extrahiert saubere Textzeichen aus Binärdaten
function readAsciiFromBin(uint8Array, startOffset, length) {
  let text = "";
  const end = Math.min(startOffset + length, uint8Array.length);
  for (let i = startOffset; i < end; i++) {
    const code = uint8Array[i];
    if (code >= 32 && code <= 126) {
      text += String.fromCharCode(code);
    } else {
      text += " ";
    }
  }
  return text.replace(/\s+/g, ' ').trim();
}

// Event-Listener reagiert sofort beim Laden einer Datei
document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(event) {
    const buffer = event.target.result;
    const uint8Array = new Uint8Array(buffer);
    
    // Basis-Offset aus deiner Rückmeldung
    const offsetBase = 0x01F20; 

    // 1. Beide Namen aus den verifizierten Offsets ausgeben
    const name1 = readAsciiFromBin(uint8Array, offsetBase, 24);
    document.getElementById("gameOutput1").textContent = name1 || "Leer / Nicht lesbar";

    const name2 = readAsciiFromBin(uint8Array, offsetBase + 0x48, 24);
    document.getElementById("gameOutput2").textContent = name2 || "Leer / Nicht lesbar";

    // 2. Laufzeit-Bytes am berechneten Versatz-Punkt auslesen (0x01F20 + 190)
    const dateOffset = offsetBase + 190; 
    
    if (uint8Array.length >= dateOffset + 8) {
      const b0 = uint8Array[dateOffset];
      const b1 = uint8Array[dateOffset + 1];
      const b2 = uint8Array[dateOffset + 2];
      const b3 = uint8Array[dateOffset + 3];
      
      // Little-Endian 32-Bit Integer rekonstruieren
      const decimalValue = (b0 | (b1 << 8) | (b2 << 16) | (b3 << 24)) >>> 0;
      
      // Formel umkehren: dateInt = (decimalValue + 65) / 9
      const dateInt = (decimalValue + 65) / 9;
      const dateStr = Math.round(dateInt).toString().padStart(8, '0'); // Format: TTMMJJJJ
      
      const day = dateStr.substring(0, 2);
      const month = dateStr.substring(2, 4);
      const year = dateStr.substring(4, 8);
      
      // Plausibilitätsprüfung für das ausgelesene Datum
      if (!isNaN(dateInt) && dateInt > 0 && parseInt(year) >= 1990) {
        document.getElementById("dateInput").value = `${year}-${month}-${day}`;
        document.getElementById("decOutput").textContent = decimalValue;
        
        let hexSeq = [];
        for (let i = dateOffset; i < dateOffset + 8; i++) {
          hexSeq.push(uint8Array[i].toString(16).toUpperCase().padStart(2, '0'));
        }
        document.getElementById("hexOutput").textContent = hexSeq.join(' ');
      }
    }
  };
  
  reader.readAsArrayBuffer(file);
});

// Vorwärts-Berechnung (wird ausgeführt bei Klick auf "Berechnen" oder beim Laden)
function calculateBytes() {
  const dateInputElement = document.getElementById("dateInput");
  const dateValue = dateInputElement.value;
  
  if (!dateValue) {
    alert("Bitte wähle ein gültiges Datum aus.");
    return;
  }

  const maxDate = "2099-12-31";
  if (dateValue < today || dateValue > maxDate) {
    alert("Das Datum muss zwischen heute und dem 31.12.2099 liegen.");
    return;
  }

  // Datumsteile zerlegen ("JJJJ-MM-TT") und richtig zu "TTMMJJJJ" zusammensetzen
  const parts = dateValue.split("-");
  const formattedDateStr = parts[2] + parts[1] + parts[0]; 
  const dateInt = parseInt(formattedDateStr);

  const decimalValue = dateInt * 9 - 65;

  const byte0 = decimalValue & 0xFF;
  const byte1 = (decimalValue >> 8) & 0xFF;
  const byte2 = (decimalValue >> 16) & 0xFF;
  const byte3 = (decimalValue >> 24) & 0xFF;
  
  const valueBytes = [byte0, byte1, byte2, byte3];
  const complementBytes = valueBytes.map(b => (~b) & 0xFF);
  const combinedSequence = valueBytes.concat(complementBytes);

  const hexString = combinedSequence
    .map(b => b.toString(16).toUpperCase().padStart(2, '0'))
    .join(' ');

  document.getElementById("decOutput").textContent = decimalValue;
  document.getElementById("hexOutput").textContent = hexString;
}

// Skript direkt beim Laden einmal manuell ausführen
window.onload = calculateBytes;
</script>

</body>
</html>
